name: nordtf

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no Infisical ou no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no Infisical ou no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no Infisical ou no .env}
    ports:
      - "${DB_PORTA:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?defina GARAGE_RPC_SECRET no Infisical ou no .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?defina GARAGE_ADMIN_TOKEN no Infisical ou no .env}
    ports:
      - "3900:3900"
    volumes:
      - ./backend/docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    environment: &ambiente-da-api
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      S3_ENDPOINT: http://garage:3900
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no Infisical ou no .env}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no Infisical ou no .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?defina SEED_ADMIN_EMAIL no Infisical ou no .env}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:?defina SEED_ADMIN_SENHA no Infisical ou no .env}
      # Without :? because Compose interpolates each file before merging, and compose.prod.yaml
      # runs without the test account. In dev the seed fails with the missing variable's name.
      SEED_CLIENTE_EMAIL: ${SEED_CLIENTE_EMAIL:-}
      SEED_CLIENTE_SENHA: ${SEED_CLIENTE_SENHA:-}
      S3_REGION: ${S3_REGION:?defina S3_REGION no Infisical ou no .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID no Infisical ou no .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no Infisical ou no .env}
      S3_BUCKET: ${S3_BUCKET:?defina S3_BUCKET no Infisical ou no .env}
      S3_BUCKET_TEST: ${S3_BUCKET_TEST:-}
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/test
          target: /app/test
        - action: sync+restart
          path: ./backend/prisma.config.ts
          target: /app/prisma.config.ts
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/pnpm-lock.yaml

  setup:
    build:
      context: ./backend
      target: dev
    pull_policy: build
    command: ["sh", "docker/setup.sh"]
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      <<: *ambiente-da-api
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?defina GARAGE_ADMIN_TOKEN no Infisical ou no .env}

  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
      VITE_WHATSAPP_NUMERO: ${VITE_WHATSAPP_NUMERO:-}
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

volumes:
  db_data:
  garage_meta:
  garage_data:
